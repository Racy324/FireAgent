# Application-level defaults.
app:
  name: FireAgent
  environment: local
  log_level: INFO

rag:
  chunk_size: 800
  chunk_overlap: 120
  parent_chunk_size: 1800
  enable_web_fallback: true

ingestion:
  pdf_parser: pdfplumber
  mineru_output_dir: data/parsed/mineru
  mineru_backend: pipeline
  mineru_model_source: ""
  mineru_timeout: 1800.0
  mineru_keep_output: true
  mineru_cli_path: mineru

retrieval:
  max_rewrite_queries: 4
  dense_top_k: 30
  sparse_top_k: 30
  fusion_top_k: 50
  rerank_top_k: 10
  dense_weight: 0.65
  sparse_weight: 0.35
  rrf_k: 60
  context_max_chars: 6000
  context_max_evidence_chars: 1200
  sufficiency_min_score: 0.18
  sufficiency_min_evidence: 2
  sufficiency_min_term_coverage: 0.30
  cross_doc_min_docs: 2

web:
  force_web_temporal: true
  force_web_official: true
  disable_for_local_scope: true
  disable_for_harmful: true
  ask_clarify_for_ambiguous: true
  temporal_keywords:
    - 最新
    - 政策
    - 标准
    - 规范
    - 法规
    - 事故
    - "2026"
    - 今年
    - 最近
    - 现行
    - 当前
    - 近期
    - 刚发布
    - 现在
  official_keywords:
    - 标准
    - 规范
    - 法规
    - 政策
    - 官方
    - 通报
    - 统计
    - 应急管理部
    - 消防救援局
    - GB
    - 现行版本
  local_scope_keywords:
    - 根据本地知识库
    - 仅基于知识库
    - 只看上传文档
    - 根据这些论文
    - 这批论文
    - 根据论文
    - 仅根据本地
  harmful_keywords:
    - 纵火
    - 制造火灾
    - 规避消防
    - 绕过报警
    - 破坏灭火
    - 提高火灾破坏
    - 如何放火
    - 怎么纵火
  ambiguous_keywords:
    - 那个
    - 这个
    - 这篇
    - 它
    - 上述
    - 前面提到

tavily:
  api_key: ""
  base_url: https://api.tavily.com
  max_results: 5
  search_depth: basic
  topic: general
  include_answer: true
  include_raw_content: false
  include_images: false
  timeout: 30.0
  chunks_per_source: 3

evaluation:
  dataset_path: data/eval/fireagent_eval_sample.jsonl
  output_dir: data/eval/runs
  default_mode: manual
  fail_under:

memory:
  enabled: true
  database_path: data/app/fireagent.db
  recent_message_limit: 8
  short_term:
    enabled: true
    recent_message_limit: 8
    max_chars: 3500
    rolling_summary_max_chars: 1500
    summarize_after_messages: 20
    intermediate_result_limit: 8
    pinned_message_limit: 8
  long_term:
    enabled: true
    collection: fireagent_memories
    top_k: 5
    max_prompt_chars: 1200
    min_relevance_score: 0.35
    write_enabled: true
    importance_threshold: 0.72
    confidence_threshold: 0.65
    max_candidates_per_turn: 2
    default_half_life_days: 180
    semantic_half_life_days: 365
    episodic_half_life_days: 90
    procedural_half_life_days: 365
    dedup_similarity_threshold: 0.88
