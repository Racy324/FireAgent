name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fail if private or generated files are tracked
        shell: bash
        run: |
          forbidden_regex='^(\.env$|\.env\.(local|development|production|test)$|data/raw_pdfs/|data/parsed/|data/chunks/|data/eval/runs/|models/|frontend/dist/|frontend/node_modules/|__pycache__/|\.pytest_cache/|notes/|personal-kb/|AGENTS\.md$|Claude\.md$|download\.py$|README copy\.md$)'
          if git ls-files | grep -E "$forbidden_regex"; then
            echo "Forbidden private, generated, or large files are tracked."
            exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create empty local env file for compose validation
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet
