[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fireagent"
version = "0.1.0"
description = "Fire-domain RAG and agent question answering system over local PDF papers."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "FireAgent Contributors" }
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "loguru>=0.7",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.7",
    "FlagEmbedding>=1.2",
    "pdfplumber>=0.11",
    "rank-bm25>=0.2",
    "tavily-python>=0.3",
    "langgraph>=0.2",
    "langchain-text-splitters>=0.2",
    "httpx>=0.27",
    "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5"
]
model-download = [
    "modelscope>=1.14"
]
pdf-mineru = [
    "mineru[all]"
]
eval = [
    "ragas>=0.2",
    "datasets>=2.19",
    "pandas>=2.0"
]
detection = [
    "opencv-python-headless>=4.9",
    "ultralytics>=8.3",
    "numpy>=1.24"
]

[project.scripts]
fireagent = "fireagent.main:main"
fireagent-ingest = "scripts.ingest_pdfs:main"
fireagent-query = "scripts.query_cli:main"
fireagent-rebuild = "scripts.rebuild_index:main"
fireagent-evaluate = "scripts.evaluate_rag:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fireagent*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
